# Linker config for Quazatron: cc65 atmos.cfg plus a HIBSS segment at $9C00.
SYMBOLS {
    __TAPEHDR__:   type = import;
    __BASHDR__:    type = import;
    __PROGFLAG__:  type = weak, value = $00; # $00=BASIC, $80=machine code
    __AUTORUN__:   type = weak, value = $C7; # autorun
    __STACKSIZE__: type = weak, value = $0140; # C stack
    __GRAB__:      type = weak, value = 0; # 0=don't grab graphics RAM, 1=grab graphics RAM
    __RAMEND__:    type = weak, value = $8680; # $8A00-$9FFF = deck buffer
}
MEMORY {
    ZP:      file = "", define = yes, start = $00E2,            size = $001A;
    TAPEHDR: file = %O, type   = ro,  start = $0000,            size = $001F;
    BASHEAD: file = %O, define = yes, start = $0501,            size = $000D;
    MAIN:    file = %O, define = yes, start = __BASHEAD_LAST__, size = __RAMEND__ - __MAIN_START__;
    BSS:     file = "",               start = __ONCE_RUN__,     size = __RAMEND__ - __STACKSIZE__ - __ONCE_RUN__;
    HIRAM:   file = "", define = yes, start = $8680,            size = $0380; # below the deck buffer
    PG2:     file = "", define = yes, start = $0200,            size = $0100; # ROM workspace, unused
    PG4:     file = "", define = yes, start = $0400,            size = $0100;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    TAPEHDR:  load = TAPEHDR, type = ro;
    BASHDR:   load = BASHEAD, type = ro,  optional = yes;
    STARTUP:  load = MAIN,    type = ro;
    LOWCODE:  load = MAIN,    type = ro,  optional = yes;
    CODE:     load = MAIN,    type = ro;
    RODATA:   load = MAIN,    type = ro;
    DATA:     load = MAIN,    type = rw;
    INIT:     load = MAIN,    type = rw;
    ONCE:     load = MAIN,    type = ro,  define   = yes;
    BASTAIL:  load = MAIN,    type = ro,  optional = yes;
    BSS:      load = BSS,     type = bss, define   = yes;
    HIBSS:    load = HIRAM,   type = bss, define   = yes;
    PAGE2:    load = PG2,     type = bss, define   = yes;
    PAGE4:    load = PG4,     type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
